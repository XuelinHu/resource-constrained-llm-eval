tasks:
  mmlu:
    suite: lm_eval
    task_name: mmlu
    metric: acc
    split: test

  ceval:
    suite: lm_eval
    task_name: ceval-valid
    metric: acc
    split: validation

  bilingual_approved_qa:
    suite: local_jsonl
    train_file: data/qlora_bilingual_approved/train.jsonl
    valid_file: data/qlora_bilingual_approved/valid.jsonl
    test_file: data/qlora_bilingual_approved/test.jsonl
    metric: char_f1
    prompt_field: prompt
    answer_field: answer
    prompt_text_field: prompt_text
    text_field: text
    training_format: completion_only

  rag_answer_generation:
    suite: cached_jsonl
    test_file: data/rag_eval/railway_bilingual_400.jsonl
    pairs: 400
    language_specific_queries: 800
    metrics: [answer_f1, reference_containment, citation_format_coverage, latency]

  directional_translation:
    suite: generated_jsonl
    directions: [zh_to_en, en_to_zh]
    subtasks: [terminology, sentence]
    metrics: [sacrebleu, chrf++, comet]

  retrieval:
    suite: cached_jsonl
    test_file: data/exports/retrieval_eval_railway_bilingual_400.json
    metrics: [recall_at_1, recall_at_3, recall_at_5, mrr, latency]

  retrieval_load:
    suite: api_load_test
    concurrency: [1, 5, 10]
    requests_per_level: 12
