experiment:
  name: ijwis_single_gpu_3090
  device: cuda:0
  gpu_name: RTX_3090
  vram_gb: 24
  seed: 42
  output_root: results/ijwis_single_gpu_3090

baseline:
  models:
    - qwen2_5_7b_instruct
    - glm_4_9b_chat_hf
  tasks:
    - mmlu
    - ceval
    - domain_qa
    - bilingual_approved_qa
  lm_eval_limit: 200
  num_fewshot: 0
  batch_size: 1
  precision: int4
  max_new_tokens: 128
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  efficiency_prompt_file: data/efficiency/prompts.jsonl
  efficiency_num_samples: 90
  efficiency_repeats: 3
  warmup_prompts: 1
  local_batch_size_short: 8
  local_batch_size_long: 2

quantization:
  modes: [int4]

qlora:
  candidate_models:
    - qwen2_5_7b_instruct
    - glm_4_9b_chat_hf
  target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, down_proj, gate_proj]
  lora_r: 64
  lora_alpha: 16
  lora_dropout: 0.05
  learning_rate: 2.0e-4
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  max_seq_length: 1024
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  evaluation_strategy: epoch
